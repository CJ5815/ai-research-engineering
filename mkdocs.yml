site_name: AI Research & Engineering
site_description: From neural networks to intelligent agents
site_url: https://cj5815.github.io/ai-research-engineering/
repo_url: https://github.com/CJ5815/ai-research-engineering
theme:
  name: material
  palette:
  - scheme: default
    primary: blue grey
    accent: blue
  - scheme: slate
    primary: blue grey
    accent: blue
  features:
  - navigation.sections
  - navigation.top
  - search.highlight
  - content.code.copy
nav:
- Home: index.md
- Roadmap: roadmap.md
- Research map: research-map.md
- Paper relationships: paper-relationships.md
- Foundations:
  - AI Foundations and Reading Guide: chapters/ai-foundations-and-reading-guide.md
  - Neural networks and attention: chapters/foundations.md
  - Model training and adaptation: chapters/adaptation.md
  - Knowledge, memory and context: chapters/knowledge.md
  - Reasoning and agents: chapters/reasoning.md
  - Inference and systems engineering: chapters/systems.md
  - Evaluation and testing: chapters/evaluation.md
- Papers:
  - Catalog: papers/index.md
  - Transformer: papers/transformer.md
  - Rag: papers/rag.md
  - Lora: papers/lora.md
  - Cot: papers/cot.md
  - React: papers/react.md
  - Lost Middle: papers/lost-middle.md
  - Pagedattention: papers/pagedattention.md
  - Graphrag: papers/graphrag.md
- Curriculum:
  - 20-week syllabus: curriculum.md
  - Week 1 · Perceptrons: weeks/week-01.md
  - Week 2 · Backpropagation: weeks/week-02.md
  - Original reading path: legacy-curriculum.md
- Labs:
  - Overview: labs.md
  - Week 1 · Perceptron warm-up: labs/01_perceptron_and_neural_networks.md
  - Week 4 · Attention: labs/02_attention_from_scratch.md
  - Week 5 · Transformer: labs/03_transformer_architecture.md
- Applications: applications.md
- Experiments:
  - Overview: experiments/index.md
  - Week 1 · Linear separability: experiments/week-01.md
  - Week 2 · Nonlinear baseline: experiments/week-02.md
- Assessments:
  - Competency rubric: assessments/index.md
  - Week 1 · Practice bank: assessments/week-01.md
  - Week 2 · Practice bank: assessments/week-02.md
- Capstone: capstone/index.md
- Further reading: further-reading.md
- Glossary: glossary.md
markdown_extensions:
- admonition
- tables
- toc
- pymdownx.arithmatex:
    generic: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
- javascripts/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
- javascripts/map.js
- javascripts/paper-graph.js
extra_css:
- stylesheets/extra.css
strict: true
